[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smd-music"
version = "0.1.0"
description = "Extract editable music structure and sound assets from Sega Mega Drive / Genesis music sources"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smd-music contributors"}]
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
smd-music = "smd_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
smd_music = ["*.mjs"]
